[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tezkit"
version = "0.1.0"
description = "Türkçe tez yazarları için biçim, kaynakça ve istatistik araçları"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Tuğba Güneş"}]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "openpyxl>=3.1", "python-docx>=1.1",
                "pyreadstat>=1.2", "pypdf>=4.0", "pyyaml>=6.0", "requests>=2.31"]

[project.optional-dependencies]
web = ["streamlit>=1.40"]
dev = ["pytest", "reportlab>=4.0"]

[project.scripts]
tezkit-bicim = "tezkit.format_check:main"
tezkit-bulgular = "tezkit.survey_report:main"
tezkit-kaynakca = "tezkit.citation_check:main"
tezkit-olcek = "tezkit.scale_scoring:main"
tezkit-orneklem = "tezkit.power:main"
tezkit-literatur = "tezkit.literature_table:main"

[tool.setuptools]
packages = ["tezkit"]
